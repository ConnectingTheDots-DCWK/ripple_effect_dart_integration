# Publishes a release to pub.dev, with the pin checked and the suite run
# first, and cuts the GitHub release beside it.
#
# pub.dev's automated publishing accepts only a run started by a **tag
# push** — not a dispatch — so the tag is the release: `git tag v1.5.0 &&
# git push origin v1.5.0`, by the maintainer, from main. The tag must be
# `v` and the pubspec's version, or pub.dev refuses the token. No secret is
# stored: the job's OIDC token is what pub.dev trusts, once the package's
# admin page enables automated publishing for this repository with the tag
# pattern `v{{version}}`. The first version of a package is uploaded by hand.

name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: The tag is the pubspec's version, on main
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME}, pubspec ${version}"; exit 1; }
          grep -q "^## ${version}$" CHANGELOG.md || { echo "CHANGELOG.md has no ## ${version}"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "${GITHUB_REF_NAME} is not on main"; exit 1; }
      - run: bash scripts/pin-engine.sh --verify
      - run: dart pub get
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dart run tool/engine.dart fetch --conformance --web
      - run: |
          (cd tool/web && npm ci --ignore-scripts)
          node tool/web/build.mjs
      - run: dart test
        env:
          RIPPLE_VARIANT: python
      - run: dart run tool/variant.dart python && dart test -p chrome --compiler dart2js,dart2wasm

  # Not dart-lang/setup-dart's reusable publish workflow: that publishes the
  # tree as checked out, and the web engine is generated, never committed.
  # setup-dart still configures pub.dev's OIDC token for a job that may ask
  # for one, which is all automated publishing needs.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dart pub get
      - run: dart run tool/engine.dart fetch --web
      - name: The web backend's engine files, which the package carries
        run: |
          (cd tool/web && npm ci --ignore-scripts)
          node tool/web/build.mjs
      - name: The archive holds them, and pub has nothing to say
        run: |
          dart pub publish --dry-run | tee dry-run.txt
          grep -q 'engine.core.wasm' dry-run.txt
          grep -q 'Package has 0 warnings' dry-run.txt
      - name: pub.dev's own reader accepts it
        run: bash scripts/check-pub-dev.sh
      - run: dart pub publish --force

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The GitHub release, its notes the changelog's section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          printf '\nhttps://pub.dev/packages/ripplefx_engine/versions/%s\n' "$version" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "ripplefx_engine $version" --notes-file notes.md --verify-tag
